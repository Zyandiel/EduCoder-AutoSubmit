# 双击 START.cmd 自动创建本地配置，并从你打开的课程页面取得地址。
course_url: "https://www.educoder.net/classrooms/YOUR_COURSE_ID/shixun_homework"
solutions_dir: "./solutions"
session_file: "./.auth/storage_state.json"

# 评测会保存代码并更新平台进度；此开关禁止最终提交。
dry_run: true
debug: true
headless: false

# chrome / msedge 使用已安装浏览器；START 向导可自动安装缺少的 Chromium。
browser_channel: chrome
navigation_timeout_ms: 60000
action_timeout_ms: 15000

# 默认自动发现所有分页中的未完成作业，不需要提前准备 cpp。
ai:
  enabled: true
  model: deepseek-flash
  timeout_seconds: 180
  max_tokens: 16000
  max_calls_per_run: 100
  max_context_chars: 160000
# API Key 使用 main.py setup 加密保存，或环境变量 DEEPSEEK_API_KEY。
# all：所有未完成作业（跳过显式 enabled:false）；configured：仅启用的名称。
assignment_scope: all
assignments: []
